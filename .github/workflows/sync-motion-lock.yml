name: Update Motion lockfile (temporary)
on:
  push:
    branches:
      - feature/premium-motion-ui
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-bun:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'feature/premium-motion-ui' || github.ref == 'refs/heads/feature/premium-motion-ui')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-motion-ui
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Resolve updated dependencies
        run: bun install --lockfile-only
      - name: Save reproducible lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): resolve Framer Motion in bun.lock"
            git push origin HEAD:feature/premium-motion-ui
          fi
